<form [formGroup]="form" (ngSubmit)="onSubmit()" class="customer-form" novalidate>

  <!-- Campo Nombre -->
  <mat-form-field appearance="outline">
    <mat-label>Nombre Completo</mat-label>
    <input matInput formControlName="name" placeholder="Ej. John Doe Smith">
    @if (isValidField('name')) {
      <mat-error>{{ getFieldError('name') }}</mat-error>
    }
  </mat-form-field>

  <!-- Campo Email -->
  <mat-form-field appearance="outline">
    <mat-label>Correo Electrónico</mat-label>
    <input matInput formControlName="email" placeholder="Ej. john.doe@example.com" type="email">
    @if (isValidField('email')) {
      <mat-error>{{ getFieldError('email') }}</mat-error>
    }
  </mat-form-field>

  <!-- Campo Teléfono -->
  <mat-form-field appearance="outline">
    <mat-label>Número de Teléfono</mat-label>
    <input matInput formControlName="phone" placeholder="Ej. +1-234-567-8900" type="tel">
    @if (isValidField('phone')) {
      <mat-error>{{ getFieldError('phone') }}</mat-error>
    }
  </mat-form-field>

  <!-- Acciones del Formulario -->
  <div class="form-actions">
    <button mat-stroked-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Guardar</button>
  </div>
</form>
