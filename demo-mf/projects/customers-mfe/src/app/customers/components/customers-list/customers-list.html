
@if (!customers() || customers().length === 0) {
  <div class="empty-state">
    <mat-icon>people_outline</mat-icon>
    <p>No se encontraron clientes.</p>
    <p>¡Añade uno nuevo para empezar!</p>
  </div>
} @else {

  <table mat-table [dataSource]="customers()" class="mat-elevation-z8 customer-table">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let customer"> {{customer.name}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>

      <td mat-cell *matCellDef="let customer"> {{customer.email}} </td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef> Teléfono </th>

      <td mat-cell *matCellDef="let customer"> {{customer.phone}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>

      <td mat-cell *matCellDef="let customer">
        <button mat-icon-button color="primary" (click)="onEdit(customer)" aria-label="Editar cliente">
          <mat-icon>Edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
}
